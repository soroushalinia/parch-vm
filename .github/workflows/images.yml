name: Build VM images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate repository
        run: ./test/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, plasma]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and test ${{ matrix.profile }} image
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed \
                arch-install-scripts \
                dosfstools \
                edk2-ovmf \
                gptfdisk \
                qemu-img \
                qemu-system-x86
              ./build.sh \
                --profile "${{ matrix.profile }}" \
                --output "output/parch-${{ matrix.profile }}.qcow2"
              BOOT_TIMEOUT=600 ./test/boot-smoke.sh \
                "output/parch-${{ matrix.profile }}.qcow2"
            '

      - name: Compress image
        run: |
          image="parch-${{ matrix.profile }}-$(date -u +%Y.%m).qcow2.zst"
          zstd -T0 -19 \
            "output/parch-${{ matrix.profile }}.qcow2" \
            -o "$image"
          sha256sum "$image" >"$image.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: parch-${{ matrix.profile }}-${{ github.run_id }}
          path: parch-${{ matrix.profile }}-*.qcow2.zst*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parch-*-${{ github.run_id }}
          merge-multiple: true
      - name: Publish monthly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm-$(date -u +%Y.%m)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Parch Linux VM images $(date -u +%Y.%m)" \
              --generate-notes
          fi
          gh release upload "$tag" ./*.qcow2.zst* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
